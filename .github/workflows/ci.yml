name: Dikoryx CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install QA Tools
        run: |
          pip install pytest pytest-cov ruff mypy httpx

      - name: Ruff
        run: ruff check backend

      - name: Mypy
        run: mypy backend

      - name: Backend Tests
        run: |
          pytest backend/tests \
          --cov=backend \
          --cov-report=xml

      - name: Agent Tests
        run: |
          pytest agent/tests \
          --cov=agent \
          --cov-report=xml

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build