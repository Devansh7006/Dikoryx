[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
check_untyped_defs = True
no_implicit_optional = True
strict_optional = True
show_error_codes = True

plugins = sqlalchemy.ext.mypy.plugin

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-sklearn.ensemble.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-argon2.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-agent.collectors.*]
ignore_errors = True

[mypy-agent.usb_monitor]
ignore_errors = True

[mypy-agent.vpn_api]
ignore_errors = True

[mypy-agent.agent]
ignore_errors = True

[mypy-agent.compliance_monitor]
ignore_errors = True
